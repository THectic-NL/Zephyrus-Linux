baseURL = 'https://zephyrus-linux.thectic.nl/'
title = 'Zephyrus Linux'
defaultContentLanguage = 'en'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']
enableGitInfo = true

# Hugo otherwise injects a tab-indented <meta name="generator"> into <head>,
# which trips HTML linters and tells every visitor the exact Hugo version.
disableHugoGeneratorInject = true

[languages]
  [languages.en]
    label = 'English'
    weight = 1
    title = 'Zephyrus Linux'
    locale = 'en-US'
  [languages.nl]
    label = 'Nederlands'
    weight = 2
    title = 'Zephyrus Linux'
    locale = 'nl-NL'

    # Dutch puts the day first. Without this the Dutch pages print "september 16, 2026".
    [languages.nl.params]
      dateFormat = '2 January 2006'

[menu]
  [[menu.main]]
    identifier = 'docs'
    name = 'Guides'
    pageRef = '/docs'
    weight = 1
  [[menu.main]]
    name = 'Distribution'
    weight = 2
    [menu.main.params]
      type = 'distro-switch'
  [[menu.main]]
    name = 'Search'
    weight = 3
    [menu.main.params]
      type = 'search'
  [[menu.main]]
    name = 'GitHub'
    weight = 4
    url = 'https://github.com/THectic-NL/Zephyrus-Linux'
    [menu.main.params]
      icon = 'github'
  [[menu.main]]
    name = 'Language'
    weight = 5
    [menu.main.params]
      type = 'language-switch'
  [[menu.main]]
    name = 'Theme'
    weight = 6
    [menu.main.params]
      type = 'theme-toggle'

[params]
  description = 'My Linux setup, written down and scripted: built on the ASUS ROG Zephyrus G16 GA605WV, usable on any laptop. Guides for CachyOS and Bazzite, plus a setup script with a guide link for every step.'

  # Hextra reads these at the top level of [params]. In TOML a key written after a [params.*]
  # table header belongs to that table, so they have to stay above the first one.
  displayUpdatedDate = true
  dateFormat = 'January 2, 2006'

  [params.navbar]
    displayTitle = true
    displayLogo = false
    width = 'wide'

  [params.theme]
    default = 'system'
    displayToggle = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
    width = 'normal'

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      index = 'content'
      tokenize = 'forward'

  [params.editURL]
    enable = true
    base = 'https://github.com/THectic-NL/Zephyrus-Linux/edit/main/content'

  [params.highlight]
    [params.highlight.copy]
      enable = true
      display = 'hover'

  [params.page]
    width = 'wide'

    # Tab groups sync by tab name across the page. Every CachyOS/Bazzite tab on
    # the site uses those two names, so picking a distribution once carries
    # through the rest of the page instead of having to be picked per block.
    [params.page.tabs]
      sync = true

  [params.imageZoom]
    enable = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
